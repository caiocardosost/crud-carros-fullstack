<div class="Container dist">
    <div class="row">
        <div class="col-lg-2"></div>
        <div class="col-lg-8">
            <div class="card">
            <div class="card-body">
                <h5 class="card-title centralizar">Lista de Carros</h5>
                    <button type="button" class="btn btn-primary direita" routerLink="/admin/carro/new">Novo</button>
                
                    <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Ano</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (carro of lista(); track $index) {
                        <tr>
                            <td>{{carro.id}}</td>
                            <td>{{carro.nome}}</td>
                            <td>{{carro.ano}}</td>
                            <td>
                                <div class="direita">
                                    <button type="button" class="btn btn-primary" routerLink="/admin/carro/edit/{{carro.id}}">Editar</button>
                                    <button type="button" class="btn btn-danger" (click)="deletar(carro)">Deletar</button>
                                </div>
                            </td>
                        </tr>
                    }
                    </tbody>
                </table>
            </div>
            </div>
        </div>
        
    </div>
</div>
