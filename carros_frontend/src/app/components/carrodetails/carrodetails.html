<div class="Container topo">
    <div class="row">
        <div class="col-lg-2"></div>
        <div class="col-lg-8">
            <div class="card topo">
                <div class="card-body">
                    <h4 class="card-title centralizar">Novo Registro</h4>
                    <hr>
                    <p class="card-text">
                    <mdb-form-control>
                        <input mdbInput type="text" id="nome" class="form-control" [(ngModel)]="carro().modelo" />
                        <label mdbLabel class="form-label" for="nome">Modelo</label>
                    </mdb-form-control>
                    <br>
                    <mdb-form-control>
                        <select mdbInput class="form-control" [(ngModel)]="carro().marca">
                            <option [ngValue]="null">Selecione uma marca</option>

                            @for (marca of marcas(); track marca.id) {
                                <option [ngValue]="marca">
                                    {{ marca.nome }}
                                </option>
                            }
                        </select>
                        <label mdbLabel class="form-label">Marca</label>
                    </mdb-form-control>
                    <br>
                    <mdb-form-control>
                        <input mdbInput type="text" id="nome" class="form-control" [(ngModel)]="carro().cor" />
                        <label mdbLabel class="form-label" for="nome">Cor</label>
                    </mdb-form-control>
                    <br>
                    <mdb-form-control>
                        <input mdbInput type="text" id="ano" class="form-control" [(ngModel)] = "carro().ano" />
                        <label mdbLabel class="form-label" for="ano">Ano</label>
                    </mdb-form-control>
                    <br>
                    <mdb-form-control>
                        <input mdbInput type="text" id="nome" class="form-control" [(ngModel)]="carro().preco" />
                        <label mdbLabel class="form-label" for="nome">Preço</label>
                    </mdb-form-control>
                    <br>
                    <hr>
                    <h5 class="centralizar">Lista de acessorios</h5>
                    <hr>
                    <mdb-form-control>
                        <select mdbInput class="form-control" [(ngModel)]="acessorio">
                            <option [ngValue]="null">Selecione um acessorio</option>

                            @for (acess of acessoriosList(); track acess.id) {
                                <option [ngValue]="acess">
                                    {{ acess.nome }}
                                </option>
                            }
                        </select>
                        <label mdbLabel class="form-label">Acessorio</label>
                    </mdb-form-control>
                    <br>
                    <div class="centralizar">
                        <button type="button" class="btn btn-primary" (click)="inserir()">inserir</button>
                    </div>
                    <table class="table table-striped">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th class="centralizar">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of acessoriosCarro(); track item.id) {
                        <tr>
                            <td>{{item.id}}</td>
                            <td>{{item.nome}}</td>
                            <td>
                                <div class="centralizar">
                                    <button type="button" class="btn btn-danger" (click)="deletar(acessorio.id)">Remover</button>
                                </div>
                            </td>
                        </tr>
                    }
                    </tbody>
                </table>
                    
                    <div class="centralizar">
                        <button type="button" class="btn btn-primary" (click)="save()">salvar</button>
                    </div>
                </div>
            </div>
            
        </div>
        <div class="col-lg-2"></div>
    </div>
</div>
